name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  Build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Stash build
      # Grabs production build + test suite
      uses: actions/upload-artifact@v4
      with:
        name: build-bundle
        path: |
          BrowserTests/
          Web Browser.sln
          Web Browser.csproj
          **/bin/Release/
          **/obj/

  Test:
    runs-on: windows-latest
    needs: Build
    steps:
      - name: Grab Stash
        uses: actions/download-artifact@v4
        with:
          name: build-bundle
          path: .
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Run tests
        run: dotnet test --no-build --logger "console;verbosity=normal"
        
